[package]
name = "baibo"
version = "0.1.0"
description = "Local-first workspace for coordinating coding agents"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "baibo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
git2 = { version = "0.20", default-features = false }
log = "0.4"
libc = "0.2"
portable-pty = "=0.9.0"
rusqlite = { version = "0.30", features = ["bundled"] }
rusqlite_migration = "1.1"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
